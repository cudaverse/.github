name: Feature request
description: Propose a focused cudaverse capability
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: Describe the R or Bioconductor workflow this would improve.
    validations:
      required: true
  - type: textarea
    id: api
    attributes:
      label: Proposed API or behavior
      description: Show how the feature could compose with existing cudaverse objects.
      render: r
  - type: textarea
    id: backend
    attributes:
      label: Backend and fallback expectations
      description: Note CUDA requirements, CPU fallback behavior, and relevant object types.
