name: Bug report
description: Report a reproducible problem in a cudaverse package
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thank you for providing a small, reproducible report.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproducible example
      description: Include the smallest R example that demonstrates the problem.
      render: r
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - CPU
        - CUDA
        - Auto-selected
        - Unknown
    validations:
      required: true
  - type: textarea
    id: session
    attributes:
      label: Session information
      description: Paste `sessionInfo()` and relevant GPU/driver details.
      render: text
    validations:
      required: true
