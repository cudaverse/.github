on:
  workflow_call:
    inputs:
      changed_repository:
        description: Cudaverse package repository whose ref replaces main
        required: false
        type: string
        default: ""
      changed_source_repository:
        description: Repository containing changed_ref, including a PR fork
        required: false
        type: string
        default: ""
      changed_ref:
        description: Commit or ref to test for the changed repository
        required: false
        type: string
        default: ""
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 1"

name: identifier-integration

permissions:
  contents: read

jobs:
  cpu-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the integration contract
        uses: actions/checkout@v7
        with:
          repository: cudaverse/.github
          ref: main
          path: contract

      - name: Check out cudaverse
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.changed_repository == 'cudaverse/cudaverse' && inputs.changed_source_repository || 'cudaverse/cudaverse' }}
          ref: ${{ inputs.changed_repository == 'cudaverse/cudaverse' && inputs.changed_ref || 'main' }}
          path: packages/cudaverse

      - name: Check out cudacellr
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.changed_repository == 'cudaverse/cudacellr' && inputs.changed_source_repository || 'cudaverse/cudacellr' }}
          ref: ${{ inputs.changed_repository == 'cudaverse/cudacellr' && inputs.changed_ref || 'main' }}
          path: packages/cudacellr

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install integration dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: packages/cudaverse
          packages: any::Matrix, any::igraph, bioc::SingleCellExperiment
          dependencies: '"hard"'

      - name: Install the two-package source stack
        run: |
          R CMD INSTALL packages/cudaverse
          R CMD INSTALL packages/cudacellr

      - name: Verify identifier preservation across packages
        run: Rscript contract/scripts/check-identifiers.R
