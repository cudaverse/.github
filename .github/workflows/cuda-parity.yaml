on:
  workflow_call:
  workflow_dispatch:

name: cuda-parity

permissions:
  contents: read

jobs:
  hardware-contract:
    name: NVIDIA hardware contract (trusted changes only)
    if: >-
      contains(
        fromJSON(
          '["cudaverse/.github","cudaverse/cudaverse","cudaverse/cudacellr"]'
        ),
        github.repository
      ) &&
      (
        (
          (github.event_name == 'push' ||
           github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/main'
        ) ||
        (
          github.repository != 'cudaverse/.github' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.base.ref == 'main' &&
          github.event.pull_request.draft == false &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.user.type == 'User' &&
          github.event.sender.type == 'User' &&
          !endsWith(github.actor, '[bot]') &&
          contains(
            fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
            github.event.pull_request.author_association
          )
        ) ||
        (
          github.repository == 'cudaverse/.github' &&
          github.event_name == 'pull_request_target' &&
          github.event.pull_request.base.ref == 'main' &&
          github.event.pull_request.draft == false &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.user.type == 'User' &&
          github.event.sender.type == 'User' &&
          !endsWith(github.actor, '[bot]') &&
          contains(
            fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
            github.event.pull_request.author_association
          )
        )
      )
    runs-on:
      group: cudaverse-nvidia
      labels: [self-hosted, linux, x64, cuda]
    timeout-minutes: 60
    env:
      CUDAVERSE_REQUIRE_CUDA: "true"
    steps:
      - name: Check out the hardware contract
        uses: actions/checkout@v7
        with:
          repository: cudaverse/.github
          ref: ${{ github.repository == 'cudaverse/.github' && github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.repository == 'cudaverse/.github' && github.sha || 'refs/heads/main' }}
          path: contract

      - name: Check out cudaverse
        uses: actions/checkout@v7
        with:
          repository: cudaverse/cudaverse
          ref: ${{ github.repository == 'cudaverse/cudaverse' && (github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha) || 'refs/heads/main' }}
          path: packages/cudaverse

      - name: Check out cudacellr
        uses: actions/checkout@v7
        with:
          repository: cudaverse/cudacellr
          ref: ${{ github.repository == 'cudaverse/cudacellr' && (github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha) || 'refs/heads/main' }}
          path: packages/cudacellr

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Prove the runner has NVIDIA hardware
        run: nvidia-smi

      - name: Require the preconfigured R torch CUDA runtime
        shell: Rscript {0}
        run: |
          stopifnot(requireNamespace("torch", quietly = TRUE))
          stopifnot(isTRUE(torch::cuda_is_available()))
          stopifnot(torch::cuda_device_count() > 0L)
          print(torch::cuda_device_count())

      - name: Install CPU-side integration dependencies
        shell: Rscript {0}
        run: |
          install.packages(
            c(
              "Matrix", "igraph", "testthat", "RSpectra", "Rtsne",
              "uwot", "SeuratObject", "BiocManager"
            ),
            repos = "https://cloud.r-project.org"
          )
          BiocManager::install(
            "SingleCellExperiment",
            ask = FALSE,
            update = FALSE
          )

      - name: Install the two-package source stack
        run: |
          R CMD INSTALL packages/cudaverse
          R CMD INSTALL packages/cudacellr

      - name: Run package-owned testthat suites without skips
        run: Rscript contract/scripts/check-cuda-package-tests.R

      - name: Run required CPU-CUDA parity and provenance checks
        run: Rscript contract/scripts/check-cuda-parity.R
