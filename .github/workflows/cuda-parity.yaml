on:
  workflow_call:
    inputs:
      caller_event:
        description: Event that invoked the caller workflow.
        required: true
        type: string
      caller_repository:
        description: Repository in which the caller workflow is running.
        required: true
        type: string
      source_repository:
        description: Repository that owns the source ref.
        required: true
        type: string
      source_ref:
        description: Exact commit SHA or trusted branch ref to test.
        required: true
        type: string
      base_ref:
        description: Pull-request base branch, or an empty string.
        required: true
        type: string
      draft:
        description: Whether the originating pull request is a draft.
        required: true
        type: boolean
      actor:
        description: Login that triggered the caller workflow.
        required: true
        type: string
      author_association:
        description: Pull-request author association, or an empty string.
        required: true
        type: string

name: cuda-parity

permissions:
  contents: read

jobs:
  authorize-caller:
    name: Authorize NVIDIA runner caller
    runs-on: ubuntu-latest
    outputs:
      trusted: ${{ steps.authorize.outputs.trusted }}
    steps:
      - name: Evaluate the explicit caller contract
        id: authorize
        shell: bash
        env:
          CALLER_EVENT: ${{ inputs.caller_event }}
          CALLER_REPOSITORY: ${{ inputs.caller_repository }}
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          SOURCE_REF: ${{ inputs.source_ref }}
          BASE_REF: ${{ inputs.base_ref }}
          DRAFT: ${{ inputs.draft }}
          ACTOR: ${{ inputs.actor }}
          AUTHOR_ASSOCIATION: ${{ inputs.author_association }}
        run: |
          set -euo pipefail

          trusted=false
          allowed_repository=false
          case "$CALLER_REPOSITORY" in
            cudaverse/.github|cudaverse/cudaverse|cudaverse/cudacellr)
              allowed_repository=true
              ;;
          esac

          actor_is_human=true
          if [[ "$ACTOR" == *"[bot]" ]]; then
            actor_is_human=false
          fi

          if [[ "$allowed_repository" == true ]]; then
            case "$CALLER_EVENT" in
              push|workflow_dispatch)
                if [[ "$SOURCE_REPOSITORY" == "$CALLER_REPOSITORY" ]] &&
                   [[ "$SOURCE_REF" == "refs/heads/main" ||
                      "$SOURCE_REF" == "refs/heads/develop/native-cuda" ]]; then
                  trusted=true
                fi
                ;;
              pull_request)
                if [[ "$CALLER_REPOSITORY" != "cudaverse/.github" ]] &&
                   [[ "$BASE_REF" == "main" ||
                      "$BASE_REF" == "develop/native-cuda" ]] &&
                   [[ "$DRAFT" == "false" ]] &&
                   [[ "$SOURCE_REPOSITORY" == "$CALLER_REPOSITORY" ]] &&
                   [[ "$actor_is_human" == true ]]; then
                  trusted=true
                fi
                ;;
              pull_request_target)
                if [[ "$CALLER_REPOSITORY" == "cudaverse/.github" ]] &&
                   [[ "$BASE_REF" == "main" ]] &&
                   [[ "$DRAFT" == "false" ]] &&
                   [[ "$SOURCE_REPOSITORY" == "$CALLER_REPOSITORY" ]] &&
                   [[ "$actor_is_human" == true ]]; then
                  trusted=true
                fi
                ;;
            esac
          fi

          printf '%s\n' \
            "caller_event=$CALLER_EVENT" \
            "caller_repository=$CALLER_REPOSITORY" \
            "source_repository=$SOURCE_REPOSITORY" \
            "source_ref=$SOURCE_REF" \
            "base_ref=$BASE_REF" \
            "draft=$DRAFT" \
            "actor=$ACTOR" \
            "author_association=$AUTHOR_ASSOCIATION" \
            "trusted=$trusted"
          echo "trusted=$trusted" >> "$GITHUB_OUTPUT"

  hardware-contract:
    name: NVIDIA hardware contract (trusted changes only)
    needs: authorize-caller
    if: needs.authorize-caller.outputs.trusted == 'true'
    runs-on: [self-hosted, Windows, X64, cuda]
    timeout-minutes: 60
    env:
      CUDAVERSE_REQUIRE_CUDA: "true"
      CUDAVERSE_NATIVE_TESTS: "true"
    steps:
      - name: Check out the hardware contract
        uses: actions/checkout@v7
        with:
          repository: cudaverse/.github
          ref: ${{ inputs.caller_repository == 'cudaverse/.github' && inputs.source_ref || 'refs/heads/main' }}
          path: contract

      - name: Check out cudaverse
        uses: actions/checkout@v7
        with:
          repository: cudaverse/cudaverse
          ref: ${{ inputs.caller_repository == 'cudaverse/cudaverse' && inputs.source_ref || 'refs/heads/main' }}
          path: packages/cudaverse

      - name: Check out cudacellr
        uses: actions/checkout@v7
        with:
          repository: cudaverse/cudacellr
          ref: ${{ inputs.caller_repository == 'cudaverse/cudacellr' && inputs.source_ref || 'refs/heads/main' }}
          path: packages/cudacellr

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Prove the runner has NVIDIA hardware
        run: nvidia-smi

      - name: Require the preconfigured R torch CUDA runtime
        shell: Rscript {0}
        run: |
          stopifnot(requireNamespace("torch", quietly = TRUE))
          stopifnot(isTRUE(torch::cuda_is_available()))
          stopifnot(torch::cuda_device_count() > 0L)
          print(torch::cuda_device_count())

      - name: Expose focused NVIDIA runtime libraries to the native backend
        shell: Rscript {0}
        run: |
          root <- find.package("torch")
          find_runtime <- function(pattern, variable) {
            candidates <- list.files(
              root,
              pattern = pattern,
              recursive = TRUE,
              full.names = TRUE
            )
            if (length(candidates)) {
              cat(
                variable,
                "=",
                normalizePath(candidates[[1L]], winslash = "/"),
                "\n",
                sep = "",
                file = Sys.getenv("GITHUB_ENV"),
                append = TRUE
              )
            }
          }
          find_runtime(
            "^(libcublas[.]so[.]12|cublas64_12[.]dll)$",
            "CUDAVERSE_CUBLAS_PATH"
          )
          find_runtime(
            "^(libcusolver[.]so[.]11|cusolver64_11[.]dll)$",
            "CUDAVERSE_CUSOLVER_PATH"
          )

      - name: Install CPU-side integration dependencies
        shell: Rscript {0}
        run: |
          install.packages(
            c(
              "Matrix", "igraph", "testthat", "RSpectra", "Rtsne",
              "uwot", "SeuratObject", "BiocManager"
            ),
            repos = "https://cloud.r-project.org"
          )
          BiocManager::install(
            "SingleCellExperiment",
            ask = FALSE,
            update = FALSE
          )

      - name: Install the two-package source stack
        run: |
          R CMD INSTALL packages/cudaverse
          R CMD INSTALL packages/cudacellr

      - name: Require the integrated native backend
        shell: Rscript {0}
        run: |
          diagnostics <- cudaverse::cuda_diagnostics()
          native <- diagnostics$backend_diagnostics$native
          stopifnot(
            identical(diagnostics$selected_backend, "native"),
            isTRUE(native$runtime_complete),
            isTRUE(native$self_test$passed),
            isTRUE(native$auto_eligible)
          )

      - name: Run package-owned testthat suites without skips
        run: Rscript contract/scripts/check-cuda-package-tests.R

      - name: Run required CPU-CUDA parity and provenance checks
        run: Rscript contract/scripts/check-cuda-parity.R
