on:
  push:
    branches: [main]
    paths:
      - "BENCHMARKS.md"
      - "examples/benchmark-v1.example.json"
      - "schemas/benchmark-v1.schema.json"
      - "scripts/validate-benchmark.R"
      - ".github/workflows/benchmark-contract.yaml"
  pull_request:
    paths:
      - "BENCHMARKS.md"
      - "examples/benchmark-v1.example.json"
      - "schemas/benchmark-v1.schema.json"
      - "scripts/validate-benchmark.R"
      - ".github/workflows/benchmark-contract.yaml"
  workflow_dispatch:

name: benchmark-contract

permissions:
  contents: read

jobs:
  validate-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install the validator dependency
        shell: Rscript {0}
        run: install.packages("jsonlite", repos = "https://cloud.r-project.org")
      - name: Parse the JSON Schema
        shell: Rscript {0}
        run: invisible(jsonlite::fromJSON("schemas/benchmark-v1.schema.json"))
      - name: Validate the canonical example
        run: >-
          Rscript scripts/validate-benchmark.R
          examples/benchmark-v1.example.json
