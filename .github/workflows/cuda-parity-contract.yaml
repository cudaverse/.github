on:
  push:
    branches: [main]
  # pull_request_target keeps this caller on the trusted default-branch
  # definition. The job below accepts only non-draft same-repository changes
  # from human collaborators; the reusable workflow derives their exact SHA
  # from the event context.
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

name: cuda-parity-contract

permissions:
  contents: read

jobs:
  hardware-contract:
    uses: cudaverse/.github/.github/workflows/cuda-parity.yaml@main
    with:
      caller_event: ${{ github.event_name }}
      caller_repository: ${{ github.repository }}
      source_repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      source_ref: ${{ github.event.pull_request.head.sha || github.ref }}
      base_ref: ${{ github.event.pull_request.base.ref || '' }}
      draft: ${{ github.event.pull_request.draft || false }}
      actor: ${{ github.actor }}
      author_association: ${{ github.event.pull_request.author_association || '' }}
